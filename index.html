<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub Audit Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .risk-high { background-color: #ffeded; color: #dc3545; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .risk-medium { background-color: #fff9e6; color: #ffc107; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .risk-low { background-color: #e6f9ed; color: #28a745; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .total-card { background: linear-gradient(45deg, #007bff, #6610f2); color: white; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h4 class="mb-4 text-center">💳 Subscription Audit</h4>
        
        <div class="card total-card p-4 mb-4 text-center">
            <p class="mb-1 text-white-50">Total Monthly Spend</p>
            <h1 class="display-5 font-weight-bold">${{ "%.2f"|format(total) }}</h1>
        </div>

        <h6 class="mb-3">My Subscriptions</h6>
        {% for sub in subs %}
        <div class="card p-3 mb-3">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0 fw-bold">{{ sub.name }}</h6>
                    <small class="text-muted">${{ sub.price }} / month</small>
                    <div class="mt-2">
                        <span class="risk-{{ sub.risk|lower }}">Prediction: {{ sub.risk }} Risk</span>
                    </div>
                </div>
                <a href="{{ url_for('cancel', id=sub.id) }}" class="btn btn-danger btn-sm">Cancel</a>
            </div>
        </div>
        {% endfor %}

        <div class="card bg-white p-3 mt-4">
            <p class="mb-0 small"><b>AI Insight:</b> Analyzing spend patterns for potential price hikes in your region.</p>
        </div>
    </div>
</body>
</html>
